<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Eldoria — Protótipo Isométrico</title><style>html,body{margin:0;overflow:hidden;background:#090b16;color:#f8deb0;font-family:Georgia,serif;touch-action:none}canvas{width:100vw;height:100dvh;display:block}#ui{position:fixed;top:10px;left:12px;pointer-events:none;text-shadow:0 2px 3px black}#boss{position:fixed;top:12px;left:35%;width:40%;text-align:center;pointer-events:none}#bar{height:10px;background:#361b27;border:2px solid #bc975a}#fill{height:100%;background:#c93d40;width:100%}#joy{position:fixed;bottom:24px;left:24px;width:116px;height:116px;border-radius:100%;border:2px solid #d9b77b88;background:#20233688;touch-action:none}#nub{position:absolute;left:37px;top:37px;width:42px;height:42px;border-radius:100%;background:#cdbb9b99}button{position:fixed;bottom:35px;right:25px;border-radius:50%;width:88px;height:88px;border:3px solid #edb66d;background:#822e29;color:white;font-size:17px}#dodge{right:122px;bottom:55px;width:58px;height:58px;background:#18475a}#zoom{right:18px;top:15px;bottom:auto;width:45px;height:45px;background:#22283c}#msg{position:fixed;bottom:8px;left:42%;pointer-events:none;color:#ffdfae}#ui{background:#101521cc;border:1px solid #b99762;border-radius:10px;padding:9px 12px;max-width:52vw;font:12px system-ui}#ui b{color:#f7dca0;letter-spacing:1px}#health{margin-top:4px}#manaBar,#lifeBar{width:175px;max-width:45vw;height:8px;background:#171b29;border:1px solid #8d785e;margin-top:4px;border-radius:6px;overflow:hidden}#manaFill{height:100%;width:100%;background:linear-gradient(90deg,#2258a4,#79d7ff)}#lifeFill{height:100%;width:100%;background:linear-gradient(90deg,#922c42,#fa7775)}#party{display:flex;gap:4px;margin-top:6px}#party span{padding:4px 7px;border:1px solid #a48a65;background:#303448;border-radius:6px}#quest{margin-top:5px;color:#f4d79a}#boss{left:30%;width:40%;font:600 14px system-ui;background:#10111bdc;border:1px solid #a7835e;border-radius:8px;padding:5px}#map{position:fixed;top:75px;right:12px;width:105px;height:105px;border:2px solid #b69b6c;background:#111626d9;border-radius:8px}#quality{position:fixed;top:190px;right:12px;color:#f8dbad;background:#1c2433;border:1px solid #b9a074;padding:7px;border-radius:7px}#skill{right:195px;bottom:58px;width:57px;height:57px;background:#57409a}#msg{left:30%;right:30%;bottom:9px;text-align:center;background:#131522bb;border-radius:6px}button:active{filter:brightness(1.5)}@media(max-width:650px){#boss{left:35%;width:30%;font-size:10px}#map{width:75px;height:75px;top:73px}#quality{top:160px;width:90px}#ui{font-size:10px}#ui small{display:none}#skill{right:177px;bottom:55px;width:48px;height:48px}}</style><canvas id="game"></canvas><div id="ui"><b>CRÔNICAS DE ELDORIA</b><div>Criptas das Cinzas — Arena isométrica</div><div id="health"></div><div id="lifeBar"><div id="lifeFill"></div></div><div id="manaBar"><div id="manaFill"></div></div><div id="party"><span>⚔ Herói</span><span>✦ Aliado</span><span>☼ NPC</span></div><div id="quest">Missão: Derrote o Guardião</div><small>WASD / setas • Espaço atacar • Shift esquivar</small></div><div id="boss">Guardião do Relicário<div id="bar"><div id="fill"></div></div></div><canvas id="map" width="105" height="105" aria-label="Minimapa"></canvas><select id="quality" aria-label="Qualidade gráfica"><option>Baixa</option><option>Média</option><option selected>Alta</option><option>Ultra</option></select><div id="joy"><div id="nub"></div></div><button id="attack">⚔</button><button id="dodge">➤</button><button id="skill">✦</button><button id="zoom">＋</button><div id="msg"></div><script>
(()=>{'use strict';
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),health=document.getElementById('health'),fill=document.getElementById('fill'),msg=document.getElementById('msg');
let w=0,h=0,dpr=1,zoom=1.05,last=0,won=false,cam={x:0,y:0},shake=0;
const size=15,player={x:4,y:7,hp:100,max:100,face:0,inv:0,cool:0,roll:0,mana:100,attackAnim:0,impact:0},boss={x:10,y:7,hp:500,max:500,phase:0,cool:1.3,wind:0,attackX:0,attackY:0,pattern:0};
let quality="Alta",fogTick=0;const keys=new Set(),joy={x:0,y:0,id:null},particles=[];
const blocks=new Set(['3,3','4,3','11,3','12,3','2,11','3,11','11,11','12,11']);
const walk=(x,y)=>x>1.2&&y>1.2&&x<size-1.2&&y<size-1.2&&!blocks.has(Math.floor(x)+','+Math.floor(y));
const iso=(x,y,z=0)=>({x:(x-y)*42,y:(x+y)*23-z});
const uniso=(sx,sy)=>({x:(sx/42+sy/23)/2,y:(sy/23-sx/42)/2});
function resize(){w=innerWidth;h=innerHeight;dpr=Math.min(devicePixelRatio||1,quality==='Baixa'?1:quality==='Média'?1.25:quality==='Alta'?1.75:2);canvas.width=Math.floor(w*dpr);canvas.height=Math.floor(h*dpr)}addEventListener('resize',resize);resize();
function diamond(x,y,color,edge){const p=iso(x,y),a=iso(x+1,y),b=iso(x+1,y+1),c=iso(x,y+1);ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.lineTo(c.x,c.y);ctx.closePath();ctx.fillStyle=color;ctx.fill();ctx.strokeStyle=edge;ctx.lineWidth=.6;ctx.stroke()}
function flame(x,y,t){const p=iso(x,y,18);ctx.save();ctx.shadowBlur=22;ctx.shadowColor='#ff8134';ctx.fillStyle='#ffbd51';ctx.beginPath();ctx.ellipse(p.x,p.y-5,5+Math.sin(t*8+x)*2,12,0,0,7);ctx.fill();ctx.fillStyle='#fff1a4';ctx.fillRect(p.x-2,p.y-8,4,7);ctx.restore()}
function column(x,y,t){const p=iso(x,y);ctx.fillStyle='#232536';ctx.fillRect(p.x-13,p.y-57,26,55);ctx.fillStyle='#555064';ctx.fillRect(p.x-11,p.y-61,22,7);ctx.fillStyle='#84717a';ctx.fillRect(p.x-9,p.y-54,5,48);flame(x,y,t)}
function character(x,y,kind,t){const p=iso(x,y);ctx.save();ctx.translate(p.x,p.y);ctx.fillStyle='#06081299';ctx.beginPath();ctx.ellipse(0,0,20,8,0,0,7);ctx.fill();if(kind==='boss'){ctx.fillStyle='#951e39';ctx.beginPath();ctx.moveTo(-28,-33);ctx.lineTo(-52,-66+Math.sin(t*3)*6);ctx.lineTo(10,-65);ctx.lineTo(28,-28);ctx.fill();ctx.fillStyle='#44485d';ctx.fillRect(-17,-72,34,53);ctx.fillStyle='#d5b074';ctx.fillRect(-19,-75,38,8);ctx.fillStyle='#151929';ctx.fillRect(-11,-91,22,23);ctx.fillStyle='#f04b4a';ctx.fillRect(-8,-82,5,3);ctx.fillRect(4,-82,5,3);ctx.strokeStyle='#d7a45a';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(18,-55);ctx.lineTo(42,-38);ctx.stroke();ctx.fillStyle='#4a3b37';ctx.beginPath();ctx.ellipse(41,-37,16,27,-.2,0,7);ctx.fill();ctx.strokeStyle='#e0ad62';ctx.lineWidth=3;ctx.stroke();}else{ctx.fillStyle='#a92b37';ctx.beginPath();ctx.moveTo(-12,-25);ctx.lineTo(-25,-12+Math.sin(t*5)*3);ctx.lineTo(12,-18);ctx.fill();ctx.fillStyle='#36495e';ctx.fillRect(-10,-43,20,32);ctx.fillStyle='#e6cba4';ctx.fillRect(-7,-58,14,15);ctx.fillStyle='#161e30';ctx.fillRect(-9,-62,18,7);ctx.strokeStyle='#f9b15e';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(7,-36);ctx.lineTo(24,-49);ctx.stroke();}ctx.restore()}
function effect(x,y,c,n=12){for(let i=0;i<n;i++){let a=Math.random()*Math.PI*2;particles.push({x,y,z:Math.random()*25,vx:Math.cos(a)*2,vy:Math.sin(a)*2,vz:30+Math.random()*40,life:.45+Math.random()*.35,color:c})}}
function castSpell(){if(player.mana<25||won)return;player.mana-=25;player.attackAnim=.45;effect(boss.x,boss.y,"#8acbff",28);if(Math.hypot(player.x-boss.x,player.y-boss.y)<5&&boss.hp>0){boss.hp=Math.max(0,boss.hp-38);boss.phase++;shake=7;if(boss.hp===0){won=true;msg.textContent="GUARDIÃO DERROTADO!"}}}
function attack(){if(player.cool>0||won)return;player.cool=.38;player.attackAnim=.26;const d=Math.hypot(player.x-boss.x,player.y-boss.y);effect(player.x,player.y,'#ffc46a',8);if(d<2.5&&boss.hp>0){boss.hp=Math.max(0,boss.hp-25);shake=6;effect(boss.x,boss.y,'#ffac51',20);if(!boss.hp){won=true;msg.textContent='GUARDIÃO DERROTADO — Arena concluída!'}}}
function dodge(){if(player.roll>0)return;player.roll=.24;player.inv=.38;effect(player.x,player.y,"#80dfe5",9)}
document.getElementById('skill').addEventListener('pointerdown',e=>{e.preventDefault();castSpell()});document.getElementById('quality').addEventListener('change',e=>{quality=e.target.value;resize()});document.getElementById('attack').addEventListener('pointerdown',e=>{e.preventDefault();attack()});document.getElementById('dodge').addEventListener('pointerdown',e=>{e.preventDefault();dodge()});document.getElementById('zoom').onclick=()=>{zoom=zoom>1.35?.8:zoom+.2};
addEventListener('keydown',e=>{keys.add(e.key.toLowerCase());if(e.key.toLowerCase()==='q')castSpell();if(e.code==='Space'){e.preventDefault();attack()}if(e.key==='Shift')dodge()});addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));
const pad=document.getElementById('joy'),nub=document.getElementById('nub');function padmove(e){if(joy.id!==e.pointerId)return;const r=pad.getBoundingClientRect(),dx=e.clientX-r.left-r.width/2,dy=e.clientY-r.top-r.height/2,l=Math.max(1,Math.hypot(dx,dy)),k=Math.min(1,48/l);joy.x=dx*k/48;joy.y=dy*k/48;nub.style.transform='translate('+joy.x*37+'px,'+joy.y*37+'px)'}pad.addEventListener('pointerdown',e=>{joy.id=e.pointerId;pad.setPointerCapture(e.pointerId);padmove(e)});pad.addEventListener('pointermove',padmove);function release(e){if(e.pointerId!==joy.id)return;joy.id=null;joy.x=joy.y=0;nub.style.transform=''}pad.addEventListener('pointerup',release);pad.addEventListener('pointercancel',release);
function update(dt){player.cool=Math.max(0,player.cool-dt);player.attackAnim=Math.max(0,player.attackAnim-dt);player.mana=Math.min(100,player.mana+dt*4);player.inv=Math.max(0,player.inv-dt);player.roll=Math.max(0,player.roll-dt);shake=Math.max(0,shake-dt*22);let sx=(keys.has('d')||keys.has('arrowright')?1:0)-(keys.has('a')||keys.has('arrowleft')?1:0)+joy.x,sy=(keys.has('s')||keys.has('arrowdown')?1:0)-(keys.has('w')||keys.has('arrowup')?1:0)+joy.y;let dir=uniso(sx*42,sy*23),len=Math.hypot(dir.x,dir.y);if(len>.05){let speed=(player.roll?9:4)*dt,dx=dir.x/len*speed,dy=dir.y/len*speed;if(walk(player.x+dx,player.y))player.x+=dx;if(walk(player.x,player.y+dy))player.y+=dy;player.face=Math.atan2(dy,dx)}
if(!won&&boss.hp>0){const dist=Math.hypot(player.x-boss.x,player.y-boss.y);if(boss.wind>0){boss.wind-=dt;if(boss.wind<=0){if((boss.pattern===0?Math.hypot(player.x-boss.attackX,player.y-boss.attackY)<1.35:boss.pattern===1?Math.abs(player.x-boss.attackX)<.8:Math.abs(player.y-boss.attackY)<.8)&&player.inv<=0){player.hp=Math.max(0,player.hp-17);player.inv=.6;shake=9}effect(boss.attackX,boss.attackY,'#f05b42',28)}}else{boss.cool-=dt;if(boss.cool<=0){boss.wind=.9;boss.cool=2.4;boss.attackX=player.x;boss.attackY=player.y;boss.pattern=(boss.pattern+1)%3}else if(dist>2.5){const dx=(player.x-boss.x)/dist*.7*dt,dy=(player.y-boss.y)/dist*.7*dt;if(walk(boss.x+dx,boss.y))boss.x+=dx;if(walk(boss.x,boss.y+dy))boss.y+=dy}}}if(player.hp<=0){msg.textContent='Você caiu — recarregue para tentar novamente';won=true}for(let i=particles.length-1;i>=0;i--){let q=particles[i];q.life-=dt;q.x+=q.vx*dt;q.y+=q.vy*dt;q.z+=q.vz*dt;q.vz-=110*dt;if(q.life<=0)particles.splice(i,1)}const target=iso(player.x,player.y);cam.x+=(target.x-cam.x)*Math.min(1,dt*5);cam.y+=(target.y-cam.y)*Math.min(1,dt*5);health.textContent='Vida '+player.hp+'/'+player.max+' · Mana '+Math.floor(player.mana)+'/100';document.getElementById('lifeFill').style.width=player.hp/player.max*100+'%';document.getElementById('manaFill').style.width=player.mana+'%';fill.style.width=(boss.hp/boss.max*100)+'%'}

const visualAtlas={};
function visualSprite(kind){if(visualAtlas[kind])return visualAtlas[kind];const a=document.createElement('canvas');a.width=64;a.height=96;const g=a.getContext('2d');g.imageSmoothingEnabled=false;const block=(x,y,w,h,c)=>{g.fillStyle=c;g.fillRect(x,y,w,h)};const guardian=kind==='guardian',ally=kind==='ally',npc=kind==='npc';
block(19,38,28,45,guardian?'#92283e':ally?'#236b64':npc?'#49657c':'#a43246');block(22,68,10,23,'#252b37');block(36,68,10,23,'#252b37');block(19,35,29,34,guardian?'#66687a':'#526475');block(20,39,27,5,'#c1a275');block(25,49,17,4,'#a99b8b');block(12,40,10,25,'#73798b');block(46,40,10,25,'#73798b');block(24,17,20,20,'#b88d74');block(22,12,24,11,'#292e40');block(25,25,5,3,guardian?'#f55c4d':'#e7dfc8');block(38,25,5,3,guardian?'#f55c4d':'#e7dfc8');block(17,9,7,12,'#d2b475');block(44,9,7,12,'#d2b475');block(51,43,4,33,'#d6a65e');block(49,35,8,12,'#e2d0a6');if(guardian){block(6,40,13,32,'#544454');block(5,42,15,5,'#d7ad68');block(21,6,26,6,'#d7ad68')}if(ally)block(20,48,28,4,'#68dec3');if(npc)block(20,57,28,5,'#d4b26e');visualAtlas[kind]=a;return a}
function visualActor(x,y,kind,t,dir=0){const p=iso(x,y),scale=kind==='guardian'?1.55:.88;ctx.save();ctx.translate(Math.round(p.x),Math.round(p.y));ctx.fillStyle='#08091399';ctx.beginPath();ctx.ellipse(0,0,kind==='guardian'?24:15,7,0,0,Math.PI*2);ctx.fill();ctx.scale(dir>0?-1:1,1);ctx.imageSmoothingEnabled=false;ctx.drawImage(visualSprite(kind),-32*scale,-86*scale+Math.sin(t*7)*2,64*scale,96*scale);ctx.restore()}
function visualProp(x,y,kind,t){const p=iso(x,y);ctx.save();ctx.translate(p.x,p.y);
if(kind==='statue'){ctx.fillStyle='#343548';ctx.fillRect(-20,-14,40,15);ctx.fillStyle='#777587';ctx.fillRect(-15,-55,30,42);ctx.fillStyle='#9c95a2';ctx.fillRect(-10,-76,20,22);ctx.fillStyle='#3c3949';ctx.fillRect(-6,-66,12,6)}
if(kind==='rubble'){for(let i=0;i<5;i++){ctx.fillStyle=i%2?'#8d727b':'#53505e';ctx.fillRect((i*13)%35-17,-(i*7)%9,10+i%3*3,6+i%4*2)}}
if(kind==='shrub'){for(let i=0;i<9;i++){ctx.fillStyle=i%2?'#b83950':'#70283d';ctx.fillRect(Math.sin(i*3)*18-3,Math.cos(i*5)*6-16-i%3*5,8,15)}}
if(kind==='waterfall'){ctx.fillStyle='#233b51';ctx.fillRect(-28,-17,56,23);for(let i=0;i<7;i++){ctx.fillStyle=i%2?'#6eb5cb':'#b2e6e6';ctx.fillRect(-23+i*7,-30+Math.sin(t*4+i)*5,4,32)}}
if(kind==='bridge'){ctx.fillStyle='#302630';ctx.fillRect(-38,-9,76,15);for(let i=0;i<6;i++){ctx.fillStyle=i%2?'#866b58':'#ad8769';ctx.fillRect(-34+i*12,-13,10,14)}ctx.fillStyle='#d5b78d';ctx.fillRect(-39,-17,5,15);ctx.fillRect(34,-17,5,15)}
ctx.restore()}
const visualScenery=[{x:5,y:3,kind:'statue'},{x:10,y:11,kind:'statue'},{x:5,y:11,kind:'shrub'},{x:10,y:3,kind:'shrub'},{x:7,y:2,kind:'waterfall'},{x:8,y:12,kind:'bridge'},{x:4,y:10,kind:'rubble'},{x:11,y:5,kind:'rubble'},{x:3,y:8,kind:'shrub'},{x:12,y:8,kind:'shrub'}];
const visualCompanions=[{x:3.3,y:6.5,kind:'ally'},{x:3.5,y:8.3,kind:'npc'}];
function visualGlow(){for(const [x,y] of [[2,2],[12,2],[2,12],[12,12]]){const p=iso(x,y,45),g=ctx.createRadialGradient(p.x,p.y,2,p.x,p.y,110);g.addColorStop(0,'rgba(255,161,63,.24)');g.addColorStop(1,'rgba(255,115,38,0)');ctx.fillStyle=g;ctx.fillRect(p.x-110,p.y-110,220,220)}}

function render(t){ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle='#0a0d1a';ctx.fillRect(0,0,w,h);ctx.save();ctx.translate(w/2-cam.x*zoom+(Math.random()-.5)*shake,h/2-cam.y*zoom+(Math.random()-.5)*shake);ctx.scale(zoom,zoom);
for(let y=0;y<size;y++)for(let x=0;x<size;x++){const n=Math.sin(x*73+y*17);diamond(x,y,(x+y)%2?'#343241':'#413a48','#65545a');if(n>.7){const p=iso(x+.5,y+.5);ctx.fillStyle='#6e4951';ctx.fillRect(p.x,p.y,3,2)}}
const things=[];for(const [s] of blocks){const [x,y]=s.split(',').map(Number);things.push({depth:x+y,draw:()=>column(x+.5,y+.5,t)})}for(const [x,y] of [[2,2],[12,2],[2,12],[12,12]])things.push({depth:x+y,draw:()=>column(x,y,t)});
for(const a of visualScenery)things.push({depth:a.x+a.y,draw:()=>visualProp(a.x,a.y,a.kind,t)});for(const a of visualCompanions)things.push({depth:a.x+a.y,draw:()=>visualActor(a.x,a.y,a.kind,t)});things.push({depth:player.x+player.y,draw:()=>visualActor(player.x,player.y,'hero',t,player.face)});if(boss.hp>0)things.push({depth:boss.x+boss.y,draw:()=>visualActor(boss.x,boss.y,'guardian',t)});
things.sort((a,b)=>a.depth-b.depth);for(const a of things)a.draw();if(quality!=='Baixa')visualGlow();if(quality==='Ultra'){ctx.save();ctx.globalAlpha=.07;ctx.fillStyle='#9eb2dc';for(let i=0;i<22;i++){const x=Math.sin(i*83+t*.4)*450,y=Math.cos(i*27+t*.25)*230;ctx.beginPath();ctx.ellipse(x,y,100,24,.25,0,Math.PI*2);ctx.fill()}ctx.restore()}
if(boss.wind>0){const p=iso(boss.attackX,boss.attackY);ctx.strokeStyle='#ff423f';ctx.lineWidth=3;ctx.fillStyle='#ff303044';ctx.beginPath();if(boss.pattern===0)ctx.ellipse(p.x,p.y,75,39,0,0,Math.PI*2);else if(boss.pattern===1)ctx.rect(p.x-34,-350,68,700);else ctx.rect(-650,p.y-19,1300,38);ctx.fill();ctx.stroke()}if(player.attackAnim>0){const p=iso(player.x,player.y,30);ctx.strokeStyle='#ffe1a3';ctx.lineWidth=5;ctx.beginPath();ctx.arc(p.x,p.y,35,-1.3,1.2);ctx.stroke()}
for(const q of particles){const p=iso(q.x,q.y,q.z);ctx.globalAlpha=Math.min(1,q.life*2);ctx.fillStyle=q.color;ctx.fillRect(p.x,p.y,4,4)}ctx.globalAlpha=1;ctx.restore();drawMinimap()}
function drawMinimap(){const m=document.getElementById('map'),g=m.getContext('2d');g.clearRect(0,0,105,105);g.fillStyle='#252a39';g.fillRect(0,0,105,105);g.strokeStyle='#b19c7c';g.strokeRect(6,6,93,93);for(const block of blocks){const [x,y]=block.split(',').map(Number);g.fillStyle='#777184';g.fillRect(x*7,y*7,7,7)}g.fillStyle='#e45b51';g.fillRect(boss.x*7-3,boss.y*7-3,7,7);g.fillStyle='#87e9c7';g.fillRect(player.x*7-3,player.y*7-3,7,7)}
function frame(t){let dt=Math.min(.05,(t-last)/1000||0);last=t;update(dt);render(t/1000);requestAnimationFrame(frame)}requestAnimationFrame(frame);
window.eldoriaIsoDiagnostics=()=>({player:{...player},boss:{...boss},camera:{...cam},zoom,entities:4,scenery:visualScenery.length,atlasSprites:Object.keys(visualAtlas),quality,mana:player.mana,bossPattern:boss.pattern,won,projection:iso(1,1),movement:'screen-to-world inverse isometric'});
})();
</script></html>
