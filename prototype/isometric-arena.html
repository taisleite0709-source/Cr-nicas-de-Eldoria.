<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Eldoria — Protótipo Isométrico</title><style>html,body{margin:0;overflow:hidden;background:#090b16;color:#f8deb0;font-family:Georgia,serif;touch-action:none}canvas{width:100vw;height:100dvh;display:block}#ui{position:fixed;top:10px;left:12px;pointer-events:none;text-shadow:0 2px 3px black}#boss{position:fixed;top:12px;left:35%;width:40%;text-align:center;pointer-events:none}#bar{height:10px;background:#361b27;border:2px solid #bc975a}#fill{height:100%;background:#c93d40;width:100%}#joy{position:fixed;bottom:24px;left:24px;width:116px;height:116px;border-radius:100%;border:2px solid #d9b77b88;background:#20233688;touch-action:none}#nub{position:absolute;left:37px;top:37px;width:42px;height:42px;border-radius:100%;background:#cdbb9b99}button{position:fixed;bottom:35px;right:25px;border-radius:50%;width:88px;height:88px;border:3px solid #edb66d;background:#822e29;color:white;font-size:17px}#dodge{right:122px;bottom:55px;width:58px;height:58px;background:#18475a}#zoom{right:18px;top:15px;bottom:auto;width:45px;height:45px;background:#22283c}#msg{position:fixed;bottom:8px;left:42%;pointer-events:none;color:#ffdfae}</style><canvas id="game"></canvas><div id="ui"><b>CRÔNICAS DE ELDORIA</b><div>Criptas das Cinzas — Arena isométrica</div><div id="health"></div><small>WASD / setas • Espaço atacar • Shift esquivar</small></div><div id="boss">Guardião do Relicário<div id="bar"><div id="fill"></div></div></div><div id="joy"><div id="nub"></div></div><button id="attack">⚔</button><button id="dodge">➤</button><button id="zoom">＋</button><div id="msg"></div><script>
(()=>{'use strict';
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),health=document.getElementById('health'),fill=document.getElementById('fill'),msg=document.getElementById('msg');
let w=0,h=0,dpr=1,zoom=1.05,last=0,won=false,cam={x:0,y:0},shake=0;
const size=15,player={x:4,y:7,hp:100,max:100,face:0,inv:0,cool:0,roll:0},boss={x:10,y:7,hp:500,max:500,phase:0,cool:1.3,wind:0,attackX:0,attackY:0};
const keys=new Set(),joy={x:0,y:0,id:null},particles=[];
const blocks=new Set(['3,3','4,3','11,3','12,3','2,11','3,11','11,11','12,11']);
const walk=(x,y)=>x>1.2&&y>1.2&&x<size-1.2&&y<size-1.2&&!blocks.has(Math.floor(x)+','+Math.floor(y));
const iso=(x,y,z=0)=>({x:(x-y)*42,y:(x+y)*23-z});
const uniso=(sx,sy)=>({x:(sx/42+sy/23)/2,y:(sy/23-sx/42)/2});
function resize(){w=innerWidth;h=innerHeight;dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.floor(w*dpr);canvas.height=Math.floor(h*dpr)}addEventListener('resize',resize);resize();
function diamond(x,y,color,edge){const p=iso(x,y),a=iso(x+1,y),b=iso(x+1,y+1),c=iso(x,y+1);ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.lineTo(c.x,c.y);ctx.closePath();ctx.fillStyle=color;ctx.fill();ctx.strokeStyle=edge;ctx.lineWidth=.6;ctx.stroke()}
function flame(x,y,t){const p=iso(x,y,18);ctx.save();ctx.shadowBlur=22;ctx.shadowColor='#ff8134';ctx.fillStyle='#ffbd51';ctx.beginPath();ctx.ellipse(p.x,p.y-5,5+Math.sin(t*8+x)*2,12,0,0,7);ctx.fill();ctx.fillStyle='#fff1a4';ctx.fillRect(p.x-2,p.y-8,4,7);ctx.restore()}
function column(x,y,t){const p=iso(x,y);ctx.fillStyle='#232536';ctx.fillRect(p.x-13,p.y-57,26,55);ctx.fillStyle='#555064';ctx.fillRect(p.x-11,p.y-61,22,7);ctx.fillStyle='#84717a';ctx.fillRect(p.x-9,p.y-54,5,48);flame(x,y,t)}
function character(x,y,kind,t){const p=iso(x,y);ctx.save();ctx.translate(p.x,p.y);ctx.fillStyle='#06081299';ctx.beginPath();ctx.ellipse(0,0,20,8,0,0,7);ctx.fill();if(kind==='boss'){ctx.fillStyle='#951e39';ctx.beginPath();ctx.moveTo(-28,-33);ctx.lineTo(-52,-66+Math.sin(t*3)*6);ctx.lineTo(10,-65);ctx.lineTo(28,-28);ctx.fill();ctx.fillStyle='#44485d';ctx.fillRect(-17,-72,34,53);ctx.fillStyle='#d5b074';ctx.fillRect(-19,-75,38,8);ctx.fillStyle='#151929';ctx.fillRect(-11,-91,22,23);ctx.fillStyle='#f04b4a';ctx.fillRect(-8,-82,5,3);ctx.fillRect(4,-82,5,3);ctx.strokeStyle='#d7a45a';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(18,-55);ctx.lineTo(42,-38);ctx.stroke();ctx.fillStyle='#4a3b37';ctx.beginPath();ctx.ellipse(41,-37,16,27,-.2,0,7);ctx.fill();ctx.strokeStyle='#e0ad62';ctx.lineWidth=3;ctx.stroke();}else{ctx.fillStyle='#a92b37';ctx.beginPath();ctx.moveTo(-12,-25);ctx.lineTo(-25,-12+Math.sin(t*5)*3);ctx.lineTo(12,-18);ctx.fill();ctx.fillStyle='#36495e';ctx.fillRect(-10,-43,20,32);ctx.fillStyle='#e6cba4';ctx.fillRect(-7,-58,14,15);ctx.fillStyle='#161e30';ctx.fillRect(-9,-62,18,7);ctx.strokeStyle='#f9b15e';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(7,-36);ctx.lineTo(24,-49);ctx.stroke();}ctx.restore()}
function effect(x,y,c,n=12){for(let i=0;i<n;i++){let a=Math.random()*Math.PI*2;particles.push({x,y,z:Math.random()*25,vx:Math.cos(a)*2,vy:Math.sin(a)*2,vz:30+Math.random()*40,life:.45+Math.random()*.35,color:c})}}
function attack(){if(player.cool>0||won)return;player.cool=.38;const d=Math.hypot(player.x-boss.x,player.y-boss.y);effect(player.x,player.y,'#ffc46a',8);if(d<2.5&&boss.hp>0){boss.hp=Math.max(0,boss.hp-25);shake=6;effect(boss.x,boss.y,'#ffac51',20);if(!boss.hp){won=true;msg.textContent='GUARDIÃO DERROTADO — Arena concluída!'}}}
function dodge(){if(player.roll>0)return;player.roll=.24;player.inv=.38}
document.getElementById('attack').addEventListener('pointerdown',e=>{e.preventDefault();attack()});document.getElementById('dodge').addEventListener('pointerdown',e=>{e.preventDefault();dodge()});document.getElementById('zoom').onclick=()=>{zoom=zoom>1.35?.8:zoom+.2};
addEventListener('keydown',e=>{keys.add(e.key.toLowerCase());if(e.code==='Space'){e.preventDefault();attack()}if(e.key==='Shift')dodge()});addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));
const pad=document.getElementById('joy'),nub=document.getElementById('nub');function padmove(e){if(joy.id!==e.pointerId)return;const r=pad.getBoundingClientRect(),dx=e.clientX-r.left-r.width/2,dy=e.clientY-r.top-r.height/2,l=Math.max(1,Math.hypot(dx,dy)),k=Math.min(1,48/l);joy.x=dx*k/48;joy.y=dy*k/48;nub.style.transform='translate('+joy.x*37+'px,'+joy.y*37+'px)'}pad.addEventListener('pointerdown',e=>{joy.id=e.pointerId;pad.setPointerCapture(e.pointerId);padmove(e)});pad.addEventListener('pointermove',padmove);function release(e){if(e.pointerId!==joy.id)return;joy.id=null;joy.x=joy.y=0;nub.style.transform=''}pad.addEventListener('pointerup',release);pad.addEventListener('pointercancel',release);
function update(dt){player.cool=Math.max(0,player.cool-dt);player.inv=Math.max(0,player.inv-dt);player.roll=Math.max(0,player.roll-dt);shake=Math.max(0,shake-dt*22);let sx=(keys.has('d')||keys.has('arrowright')?1:0)-(keys.has('a')||keys.has('arrowleft')?1:0)+joy.x,sy=(keys.has('s')||keys.has('arrowdown')?1:0)-(keys.has('w')||keys.has('arrowup')?1:0)+joy.y;let dir=uniso(sx*42,sy*23),len=Math.hypot(dir.x,dir.y);if(len>.05){let speed=(player.roll?9:4)*dt,dx=dir.x/len*speed,dy=dir.y/len*speed;if(walk(player.x+dx,player.y))player.x+=dx;if(walk(player.x,player.y+dy))player.y+=dy;player.face=Math.atan2(dy,dx)}
if(!won&&boss.hp>0){const dist=Math.hypot(player.x-boss.x,player.y-boss.y);if(boss.wind>0){boss.wind-=dt;if(boss.wind<=0){if(Math.hypot(player.x-boss.attackX,player.y-boss.attackY)<1.35&&player.inv<=0){player.hp=Math.max(0,player.hp-17);player.inv=.6;shake=9}effect(boss.attackX,boss.attackY,'#f05b42',28)}}else{boss.cool-=dt;if(boss.cool<=0){boss.wind=.9;boss.cool=2.4;boss.attackX=player.x;boss.attackY=player.y}else if(dist>2.5){const dx=(player.x-boss.x)/dist*.7*dt,dy=(player.y-boss.y)/dist*.7*dt;if(walk(boss.x+dx,boss.y))boss.x+=dx;if(walk(boss.x,boss.y+dy))boss.y+=dy}}}if(player.hp<=0){msg.textContent='Você caiu — recarregue para tentar novamente';won=true}for(let i=particles.length-1;i>=0;i--){let q=particles[i];q.life-=dt;q.x+=q.vx*dt;q.y+=q.vy*dt;q.z+=q.vz*dt;q.vz-=110*dt;if(q.life<=0)particles.splice(i,1)}const target=iso(player.x,player.y);cam.x+=(target.x-cam.x)*Math.min(1,dt*5);cam.y+=(target.y-cam.y)*Math.min(1,dt*5);health.textContent='Vida '+player.hp+'/'+player.max;fill.style.width=(boss.hp/boss.max*100)+'%'}
function render(t){ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle='#0a0d1a';ctx.fillRect(0,0,w,h);ctx.save();ctx.translate(w/2-cam.x*zoom+(Math.random()-.5)*shake,h/2-cam.y*zoom+(Math.random()-.5)*shake);ctx.scale(zoom,zoom);
for(let y=0;y<size;y++)for(let x=0;x<size;x++){const n=Math.sin(x*73+y*17);diamond(x,y,(x+y)%2?'#343241':'#413a48','#65545a');if(n>.7){const p=iso(x+.5,y+.5);ctx.fillStyle='#6e4951';ctx.fillRect(p.x,p.y,3,2)}}
const things=[];for(const [s] of blocks){const [x,y]=s.split(',').map(Number);things.push({depth:x+y,draw:()=>column(x+.5,y+.5,t)})}for(const [x,y] of [[2,2],[12,2],[2,12],[12,12]])things.push({depth:x+y,draw:()=>column(x,y,t)});
things.push({depth:player.x+player.y,draw:()=>character(player.x,player.y,'player',t)});if(boss.hp>0)things.push({depth:boss.x+boss.y,draw:()=>character(boss.x,boss.y,'boss',t)});
things.sort((a,b)=>a.depth-b.depth);for(const a of things)a.draw();
if(boss.wind>0){const p=iso(boss.attackX,boss.attackY);ctx.strokeStyle='#ff423f';ctx.lineWidth=3;ctx.beginPath();ctx.ellipse(p.x,p.y,75,39,0,0,7);ctx.stroke();ctx.fillStyle='#ff303033';ctx.fill()}
for(const q of particles){const p=iso(q.x,q.y,q.z);ctx.globalAlpha=Math.min(1,q.life*2);ctx.fillStyle=q.color;ctx.fillRect(p.x,p.y,4,4)}ctx.globalAlpha=1;ctx.restore()}
function frame(t){let dt=Math.min(.05,(t-last)/1000||0);last=t;update(dt);render(t/1000);requestAnimationFrame(frame)}requestAnimationFrame(frame);
window.eldoriaIsoDiagnostics=()=>({player:{...player},boss:{...boss},camera:{...cam},zoom,entities:2,won,projection:iso(1,1),movement:'screen-to-world inverse isometric'});
})();
</script></html>
